<title id="chart-encoded-size-by-length-of-value--wikipedia--56-languages--title">Encoded size by length of value (Wikipedia, 56 languages)</title>
<desc id="chart-encoded-size-by-length-of-value--wikipedia--56-languages--desc">Bar chart of bytes per character for every codec, for values of 4, 8 and 16 characters, paragraphs and whole documents (Wikipedia, 56 languages). The same numbers are in the tables on the Encoded Size page.</desc>
