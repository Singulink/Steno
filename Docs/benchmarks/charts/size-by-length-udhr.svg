<desc id="chart-encoded-size-by-length-of-value--udhr--47-languages--desc">Bar chart of bytes per character for every codec, for values of 4, 8 and 16 characters, paragraphs and whole documents (UDHR, 47 languages). The same numbers are in the tables on the Encoded Size page.</desc>
